name: Build Validation

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values for CI build validation only.
      # Real secrets are injected by Railway at runtime — never committed.
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-build-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Build project
        run: bun run build
      - name: Verify standalone output
        run: test -f .next/standalone/server.js || exit 1
      - name: Build Docker image
        run: docker build -t test:latest .
